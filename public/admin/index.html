<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админка — Пластинка</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%2323395b'/><circle cx='16' cy='16' r='6' fill='%23ff8a1f'/><circle cx='16' cy='16' r='1.5' fill='%2323395b'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Onest:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <section class="login" id="login" hidden>
    <form class="login-card" id="loginForm">
      <a class="logo" href="/"><span class="logo-disc" aria-hidden="true"></span>Пластинка</a>
      <h1>Вход для персонала</h1>
      <div class="form-error" id="loginError" hidden></div>
      <label class="field"><span>Логин</span><input name="username" autocomplete="username" required></label>
      <label class="field"><span>Пароль</span><input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-dark">Войти</button>
      <p class="login-demo">Демо-доступ: <code>admin</code> / <code>admin123</code></p>
    </form>
  </section>

  <div class="shell" id="app" hidden>
    <aside class="side">
      <a class="logo" href="/"><span class="logo-disc" aria-hidden="true"></span>Пластинка</a>
      <nav class="side-nav" aria-label="Разделы админки">
        <button data-tab="overview" aria-current="page">Обзор</button>
        <button data-tab="orders">Заказы</button>
        <button data-tab="records">Каталог</button>
        <button data-tab="logs">Журнал сервера</button>
      </nav>
      <div class="side-foot">
        <p id="whoami"></p>
        <button class="btn btn-ghost btn-sm" id="logout">Выйти</button>
      </div>
    </aside>

    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <dialog class="modal" id="recordForm" aria-labelledby="recordFormTitle"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/js/admin.js"></script>
</body>
</html>
